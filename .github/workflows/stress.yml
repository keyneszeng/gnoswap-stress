name: GnoSwap Stress Test

on:
  workflow_dispatch:
    inputs:
      pkg:
        description: "Package path to stress-test"
        required: false
        default: "gno.land/r/gnoswap/pool/v1"
      run:
        description: "Test name filter (regex)"
        required: false
        default: "TestStress_"

# grant the default GITHUB_TOKEN write so the artifact upload step works
permissions:
  contents: write

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout gnoswap contracts
        uses: actions/checkout@v4
        with:
          path: gnoswap

      - name: Checkout gno toolchain (gnoswap-labs fork, master)
        uses: actions/checkout@v4
        with:
          repository: gnoswap-labs/gno
          ref: master
          path: gno

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build gno tools
        working-directory: gno
        run: |
          make install.gno
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Symlink contracts into gno examples tree (mirrors upstream Makefile)
        working-directory: gno
        run: |
          export PATH="$HOME/go/bin:$PATH"
          # link both realm (r/) and pure (p/) trees so cross-imports resolve
          SRC_R="$GITHUB_WORKSPACE/gnoswap/contract/r/gnoswap"
          SRC_P="$GITHUB_WORKSPACE/gnoswap/contract/p/gnoswap"
          DST_R="examples/gno.land/r/gnoswap"
          DST_P="examples/gno.land/p/gnoswap"
          mkdir -p "$(dirname "$DST_R")" "$(dirname "$DST_P")"
          ln -sfn "$SRC_R" "$DST_R"
          ln -sfn "$SRC_P" "$DST_P"
          echo "linked $SRC_R -> $DST_R"
          echo "linked $SRC_P -> $DST_P"
          ls -la "$DST_R" | head -3
          ls -la "$DST_P" | head -3

      - name: Run stress tests
        working-directory: gno/examples
        env:
          GNOROOT: "$GITHUB_WORKSPACE/gno"
        run: |
          export PATH="$HOME/go/bin:$PATH"
          export GNOROOT="$GITHUB_WORKSPACE/gno"
          PKG="${{ github.event.inputs.pkg }}"
          RUN="${{ github.event.inputs.run }}"
          gno test -v -run "$RUN" "./$PKG" 2>&1 | tee "$GITHUB_WORKSPACE/gnoswap/stress.log"
          echo "=== STRESS RESULT ==="
          grep -E "^(ok|FAIL|PASS|---|panic)" "$GITHUB_WORKSPACE/gnoswap/stress.log" | tail -60 || true

      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnoswap-stress-report
          path: gnoswap/stress.log
          if-no-files-found: warn
